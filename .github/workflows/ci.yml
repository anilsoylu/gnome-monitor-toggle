name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (headless Mutter)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/docker
          file: tests/docker/Dockerfile
          tags: gnome-monitor-toggle-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit, integration, translation and install tests
        run: >
          docker run --rm --network none -e PYTHONDONTWRITEBYTECODE=1
          -v "$PWD:/src:ro" gnome-monitor-toggle-test
          tests/run-headless.sh python3 -m unittest discover -s tests -v
